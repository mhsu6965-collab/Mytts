<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Myanmar TTS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      font-family: Arial, "Noto Sans Myanmar", sans-serif;
    }

    .box {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    textarea {
      width: 100%;
      height: 220px;
      padding: 15px;
      font-size: 18px;
      line-height: 1.7;
      border: 1px solid #ccc;
      border-radius: 10px;
      resize: vertical;
    }

    .voices {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .voice {
      flex: 1;
      padding: 13px;
      border: 2px solid #ccc;
      background: white;
      border-radius: 10px;
      font-size: 16px;
    }

    .voice.active {
      border-color: #222;
      background: #eee;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    #generate {
      background: #222;
      color: white;
    }

    #generate:disabled {
      opacity: 0.6;
    }

    #download {
      background: #e8e8e8;
      display: none;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      min-height: 25px;
    }

    audio {
      width: 100%;
      margin-top: 15px;
      display: none;
    }

    .count {
      text-align: right;
      color: #777;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🇲🇲 Myanmar TTS</h1>

  <textarea
    id="text"
    maxlength="5000"
    placeholder="မြန်မာစာကို ဒီမှာ ရိုက်ထည့်ပါ..."
  ></textarea>

  <div class="count">
    <span id="count">0</span> / 5000
  </div>

  <div class="voices">

    <button
      type="button"
      class="voice active"
      id="thiha"
      onclick="selectVoice('thiha')">
      👨 Thiha
    </button>

    <button
      type="button"
      class="voice"
      id="nilar"
      onclick="selectVoice('nilar')">
      👩 Nilar
    </button>

  </div>

  <button id="generate" onclick="generateTTS()">
    🔊 Generate Voice
  </button>

  <div id="status"></div>

  <audio id="audio" controls></audio>

  <button id="download" onclick="downloadAudio()">
    ⬇️ Download MP3
  </button>

</div>


<script>

  // ==========================================
  // YOUR CLOUDFLARE WORKER
  // ==========================================

  const WORKER_URL =
    "https://myanmar-tts.thetphyo77790.workers.dev/tts";


  let selectedVoice = "thiha";
  let audioBlob = null;


  // ==========================================
  // VOICE SELECT
  // ==========================================

  function selectVoice(voice) {

    selectedVoice = voice;

    document
      .getElementById("thiha")
      .classList.remove("active");

    document
      .getElementById("nilar")
      .classList.remove("active");

    document
      .getElementById(voice)
      .classList.add("active");
  }


  // ==========================================
  // CHARACTER COUNT
  // ==========================================

  document
    .getElementById("text")
    .addEventListener("input", function() {

      document.getElementById("count").textContent =
        this.value.length;

    });


  // ==========================================
  // GENERATE TTS
  // ==========================================

  async function generateTTS() {

    const text =
      document.getElementById("text").value.trim();

    const button =
      document.getElementById("generate");

    const status =
      document.getElementById("status");

    const audio =
      document.getElementById("audio");

    const download =
      document.getElementById("download");


    if (!text) {

      status.textContent =
        "⚠️ စာအရင်ထည့်ပါ။";

      return;
    }


    button.disabled = true;

    button.textContent =
      "⏳ Generating...";

    status.textContent =
      "အသံဖိုင်ပြုလုပ်နေပါတယ်...";

    audio.style.display = "none";

    download.style.display = "none";


    try {

      const response = await fetch(
        WORKER_URL,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({

            text: text,

            voice: selectedVoice

          })
        }
      );


      if (!response.ok) {

        let message =
          "Server error: " +
          response.status;

        try {

          const error =
            await response.json();

          if (error.error) {
            message = error.error;
          }

        } catch(e) {}

        throw new Error(message);
      }


      audioBlob =
        await response.blob();


      if (
        !audioBlob ||
        audioBlob.size === 0
      ) {

        throw new Error(
          "Audio file is empty."
        );
      }


      const audioURL =
        URL.createObjectURL(audioBlob);


      audio.src = audioURL;

      audio.style.display = "block";

      download.style.display = "block";


      status.textContent =
        "✅ အသံဖိုင်ရပါပြီ။";


      // Auto play
      try {
        await audio.play();
      } catch(e) {
        // Browser may block autoplay.
      }


    } catch(error) {

      console.error(error);

      status.textContent =
        "❌ Error: " +
        error.message;

    }


    button.disabled = false;

    button.textContent =
      "🔊 Generate Voice";
  }


  // ==========================================
  // DOWNLOAD MP3
  // ==========================================

  function downloadAudio() {

    if (!audioBlob) {
      return;
    }


    const url =
      URL.createObjectURL(audioBlob);


    const a =
      document.createElement("a");


    a.href = url;

    a.download =
      "myanmar-tts.mp3";


    document.body.appendChild(a);

    a.click();

    a.remove();


    URL.revokeObjectURL(url);
  }

</script>

</body>
</html>
