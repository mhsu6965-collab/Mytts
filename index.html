<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myanmar Recap AI Voice</title>
<style>
body{
 margin:0;
 padding:12px;
 background:#f3f3f3;
 font-family:Arial,"Noto Sans Myanmar",sans-serif;
}
.box{
 max-width:600px;
 margin:auto;
 background:white;
 padding:15px;
 border-radius:14px;
}
h1{text-align:center;font-size:22px}
label{font-weight:bold;display:block;margin-top:15px}
textarea,input,select,button{
 width:100%;
 box-sizing:border-box;
 margin-top:8px;
 padding:12px;
 border-radius:10px;
 border:1px solid #ccc;
 font-size:15px;
}
textarea{min-height:180px}
button{
 background:#111;
 color:white;
 border:none;
}
.row{display:flex;gap:10px}
.row div{flex:1}
audio{width:100%;margin-top:15px}
</style>
</head>
<body>
<div class="box">
<h1>Myanmar Recap AI Voice</h1>

<label>TXT Upload</label>
<input id="file" type="file" accept=".txt">

<label>Myanmar Recap Script</label>
<textarea id="script" placeholder="Generate recap script here"></textarea>

<button id="recap">Generate Long Form Recap</button>

<div class="row">
<div>
<label>Voice</label>
<select id="voice">
<option value="thiha">Thiha</option>
<option value="nilar">Nilar</option>
</select>
</div>
</div>

<label>Speed</label>
<input id="speed" type="range" min="-100" max="100" value="0">

<label>Pitch</label>
<input id="pitch" type="range" min="-100" max="100" value="0">

<button id="tts">Generate Voice</button>

<div id="status"></div>

<audio id="audio" controls></audio>
<a id="download" style="display:none">Download MP3</a>

</div>

<script>
const WORKER_URL="https://myanmar-tts.thetphyo77790.workers.dev";

let source="";

file.onchange=async()=>{
 source=await file.files[0].text();
 status.innerText="TXT loaded";
};

recap.onclick=async()=>{
 status.innerText="Generating recap...";
 let r=await fetch(WORKER_URL+"/recap",{
 method:"POST",
 headers:{"Content-Type":"application/json"},
 body:JSON.stringify({text:source})
 });
 let d=await r.json();
 if(d.success) script.value=d.text;
 else status.innerText=d.error;
};

tts.onclick=async()=>{
 status.innerText="Generating voice...";
 let r=await fetch(WORKER_URL+"/tts",{
 method:"POST",
 headers:{"Content-Type":"application/json"},
 body:JSON.stringify({
 text:script.value,
 voice:voice.value,
 speed:Number(speed.value),
 pitch:Number(pitch.value)
 })
 });
 if(!r.ok){status.innerText="TTS Error";return}
 let b=await r.blob();
 let u=URL.createObjectURL(b);
 audio.src=u;
 download.href=u;
 download.download="recap.mp3";
 download.style.display="block";
 status.innerText="Done";
};
</script>
</body>
</html>
