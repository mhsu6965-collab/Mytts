<!DOCTYPE html>
<html lang="my">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Myanmar TTS</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  background:#f4f4f4;
  font-family:
    Arial,
    "Noto Sans Myanmar",
    sans-serif;
}

.box{
  max-width:700px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:16px;
  box-shadow:0 3px 15px #0002;
}

h1{
  text-align:center;
  margin-top:0;
}

textarea{
  width:100%;
  height:250px;
  padding:15px;
  font-size:18px;
  line-height:1.7;
  border:1px solid #ccc;
  border-radius:10px;
  resize:vertical;
  font-family:
    Arial,
    "Noto Sans Myanmar",
    sans-serif;
}

.count{
  text-align:right;
  color:#777;
  margin-top:5px;
}

.row{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.voice{
  flex:1;
  padding:13px;
  border:2px solid #ccc;
  background:white;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
}

.voice.active{
  border-color:#222;
  background:#eee;
}

.control{
  margin-top:20px;
}

.control-title{
  display:flex;
  justify-content:space-between;
  font-weight:bold;
  margin-bottom:8px;
}

input[type="range"]{
  width:100%;
}

.value{
  text-align:center;
  font-size:18px;
  margin-top:5px;
}

#generate{
  width:100%;
  padding:15px;
  margin-top:20px;
  border:0;
  border-radius:10px;
  background:#222;
  color:white;
  font-size:18px;
  cursor:pointer;
}

#generate:disabled{
  opacity:.6;
}

.download-row{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.download-btn{
  flex:1;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#e5e5e5;
  font-size:16px;
  cursor:pointer;
  display:none;
}

#status{
  text-align:center;
  margin-top:15px;
  min-height:25px;
}

audio{
  width:100%;
  margin-top:15px;
  display:none;
}

.info{
  margin-top:18px;
  padding:12px;
  background:#f7f7f7;
  border-radius:10px;
  font-size:14px;
  color:#666;
  line-height:1.6;
}

</style>

</head>


<body>


<div class="box">


<h1>🇲🇲 Myanmar TTS</h1>


<textarea
  id="text"
  maxlength="20000"
  placeholder="မြန်မာစာကို ဒီမှာ ရိုက်ထည့်ပါ..."
></textarea>


<div class="count">
  <span id="count">0</span> / 20,000
</div>


<!-- VOICE -->

<div class="row">

<button
  class="voice active"
  id="thiha"
  onclick="selectVoice('thiha')"
>
👨 Thiha
</button>


<button
  class="voice"
  id="nilar"
  onclick="selectVoice('nilar')"
>
👩 Nilar
</button>

</div>


<!-- SPEED -->

<div class="control">

<div class="control-title">

<span>🎚️ Speed</span>

<span id="speedValue">
0%
</span>

</div>


<input
  type="range"
  id="speed"
  min="-100"
  max="100"
  step="1"
  value="0"
>


<div class="value">

Speed:
<span id="speedText">
0%
</span>

</div>

</div>


<!-- PITCH -->

<div class="control">

<div class="control-title">

<span>🎵 Pitch</span>

<span id="pitchValue">
0%
</span>

</div>


<input
  type="range"
  id="pitch"
  min="-100"
  max="100"
  step="1"
  value="0"
>


<div class="value">

Pitch:
<span id="pitchText">
0%
</span>

</div>

</div>


<!-- GENERATE -->

<button
  id="generate"
  onclick="generateTTS()"
>
🔊 Generate Voice
</button>


<div id="status"></div>


<!-- AUDIO -->

<audio
  id="audio"
  controls
></audio>


<!-- DOWNLOAD -->

<div class="download-row">


<button
  class="download-btn"
  id="downloadMP3"
  onclick="downloadMP3()"
>
⬇️ MP3
</button>


<button
  class="download-btn"
  id="downloadSRT"
  onclick="downloadSRT()"
>
📄 SRT
</button>


</div>


<div class="info">

💡 <b>SRT</b> ကို အသံဖိုင်ရဲ့ duration အပေါ်မူတည်ပြီး
စာကြောင်းအလိုက် အလိုအလျောက် ဖန်တီးပေးပါမယ်။

</div>


</div>


<script>


/* =========================
   WORKER
========================= */

const WORKER_URL =
"https://myanmar-tts.thetphyo77790.workers.dev/tts";


/* =========================
   VARIABLES
========================= */

let selectedVoice = "thiha";

let audioBlob = null;

let srtContent = "";


/* =========================
   VOICE SELECT
========================= */

function selectVoice(voice){

  selectedVoice = voice;


  document
    .getElementById("thiha")
    .classList.remove("active");


  document
    .getElementById("nilar")
    .classList.remove("active");


  document
    .getElementById(voice)
    .classList.add("active");

}


/* =========================
   CHARACTER COUNT
========================= */

document
.getElementById("text")
.addEventListener(
  "input",
  function(){

    document
      .getElementById("count")
      .textContent =
      this.value.length
        .toLocaleString();

  }
);


/* =========================
   SPEED
========================= */

const speed =
document.getElementById("speed");


speed.addEventListener(
  "input",
  function(){

    const value =
      parseInt(this.value);


    const display =
      formatPercent(value);


    document
      .getElementById("speedValue")
      .textContent = display;


    document
      .getElementById("speedText")
      .textContent = display;

  }
);


/* =========================
   PITCH
========================= */

const pitch =
document.getElementById("pitch");


pitch.addEventListener(
  "input",
  function(){

    const value =
      parseInt(this.value);


    const display =
      formatPercent(value);


    document
      .getElementById("pitchValue")
      .textContent = display;


    document
      .getElementById("pitchText")
      .textContent = display;

  }
);


/* =========================
   PERCENT FORMAT
========================= */

function formatPercent(value){

  if(value > 0){

    return "+" + value + "%";

  }

  return value + "%";

}


/* =========================
   GENERATE TTS
========================= */

async function generateTTS(){


  const text =
    document
      .getElementById("text")
      .value
      .trim();


  const button =
    document
      .getElementById("generate");


  const status =
    document
      .getElementById("status");


  const audio =
    document
      .getElementById("audio");


  const mp3Button =
    document
      .getElementById("downloadMP3");


  const srtButton =
    document
      .getElementById("downloadSRT");


  /* EMPTY */

  if(!text){

    status.textContent =
      "⚠️ စာအရင်ထည့်ပါ။";

    return;

  }


  /* 20,000 LIMIT */

  if(text.length > 20000){

    status.textContent =
      "⚠️ စာလုံးရေ 20,000 ထက် မကျော်ရပါ။";

    return;

  }


  button.disabled = true;

  button.textContent =
    "⏳ Generating...";


  status.textContent =
    "အသံဖိုင်ပြုလုပ်နေပါတယ်...";


  audio.style.display =
    "none";


  mp3Button.style.display =
    "none";


  srtButton.style.display =
    "none";


  srtContent = "";


  try{


    /* =====================
       SEND TO WORKER
    ===================== */

    const response =
      await fetch(

        WORKER_URL,

        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },


          body:JSON.stringify({

            text:text,

            voice:selectedVoice,

            speed:
              parseInt(
                speed.value
              ),

            pitch:
              parseInt(
                pitch.value
              )

          })

        }

      );


    /* ERROR */

    if(!response.ok){

      let errorMessage =
        "Server error: " +
        response.status;


      try{

        const error =
          await response.json();


        if(error.error){

          errorMessage =
            error.error;

        }

      }catch(e){}


      throw new Error(
        errorMessage
      );

    }


    /* AUDIO */

    audioBlob =
      await response.blob();


    if(
      !audioBlob ||
      audioBlob.size === 0
    ){

      throw new Error(
        "Audio file is empty"
      );

    }


    /* AUDIO URL */

    const audioURL =
      URL.createObjectURL(
        audioBlob
      );


    audio.src =
      audioURL;


    audio.style.display =
      "block";


    mp3Button.style.display =
      "block";


    status.textContent =
      "⏳ SRT ပြုလုပ်နေပါတယ်...";


    /* =====================
       WAIT FOR AUDIO DURATION
    ===================== */

    await waitForAudioMetadata(
      audio
    );


    const duration =
      audio.duration;


    if(
      !duration ||
      !Number.isFinite(duration)
    ){

      throw new Error(
        "Audio duration မရပါ။"
      );

    }


    /* =====================
       CREATE SRT
    ===================== */

    srtContent =
      createSRT(
        text,
        duration
      );


    if(srtContent){

      srtButton.style.display =
        "block";

    }


    status.textContent =
      "✅ အသံဖိုင် + SRT ရပါပြီ။";


    /* PLAY */

    try{

      await audio.play();

    }catch(e){}


  }catch(error){

    console.error(error);


    status.textContent =
      "❌ Error: " +
      error.message;

  }


  button.disabled = false;

  button.textContent =
    "🔊 Generate Voice";

}


/* =========================
   WAIT AUDIO METADATA
========================= */

function waitForAudioMetadata(
  audio
){

  return new Promise(
    function(resolve,reject){

      if(
        audio.readyState >= 1 &&
        Number.isFinite(audio.duration)
      ){

        resolve();

        return;

      }


      const timeout =
        setTimeout(
          function(){

            reject(
              new Error(
                "Audio duration မရပါ။"
              )
            );

          },
          15000
        );


      audio.onloadedmetadata =
        function(){

          clearTimeout(timeout);

          resolve();

        };


      audio.onerror =
        function(){

          clearTimeout(timeout);

          reject(
            new Error(
              "Audio metadata error"
            )
          );

        };

    }
  );

}


/* =========================
   CREATE SRT
========================= */

function createSRT(
  text,
  totalDuration
){


  /*
    စာကြောင်း/ဝါကျ ခွဲခြင်း

    မြန်မာ "။"
    English "."
    ?
    !
    newline
  */


  let sentences =
    text
      .replace(/\r/g,"")
      .split(
        /(?<=[။.!?])\s+|\n+/
      );


  sentences =
    sentences
      .map(
        function(item){
          return item.trim();
        }
      )
      .filter(
        function(item){
          return item.length > 0;
        }
      );


  /*
    ဝါကျတစ်ကြောင်းတည်း ဖြစ်နေခဲ့ရင်
    character chunks ခွဲ
  */

  if(sentences.length === 0){

    return "";

  }


  /*
    Subtitle တစ်ခု အရမ်းရှည်မနေအောင်
    120 characters ခန့်စီ ထပ်ခွဲ
  */

  const finalParts = [];


  for(
    const sentence of sentences
  ){

    if(sentence.length <= 120){

      finalParts.push(
        sentence
      );

      continue;

    }


    let remaining =
      sentence;


    while(
      remaining.length > 120
    ){

      let cut =
        remaining.lastIndexOf(
          " ",
          120
        );


      if(cut < 40){

        cut = 120;

      }


      finalParts.push(
        remaining
          .slice(0,cut)
          .trim()
      );


      remaining =
        remaining
          .slice(cut)
          .trim();

    }


    if(remaining){

      finalParts.push(
        remaining
      );

    }

  }


  /*
    Character အရေအတွက်အလိုက်
    audio duration ခွဲဝေ
  */

  let totalCharacters = 0;


  for(
    const part of finalParts
  ){

    totalCharacters +=
      part.length;

  }


  let currentTime = 0;

  let output = "";


  for(
    let i = 0;
    i < finalParts.length;
    i++
  ){

    const part =
      finalParts[i];


    const ratio =
      part.length /
      totalCharacters;


    let partDuration =
      totalDuration *
      ratio;


    /*
      အရမ်းတိုတဲ့ subtitle မဖြစ်အောင်
      minimum 0.5 sec
    */

    if(partDuration < 0.5){

      partDuration = 0.5;

    }


    const start =
      currentTime;


    let end =
      currentTime +
      partDuration;


    if(
      i === finalParts.length - 1
    ){

      end =
        totalDuration;

    }


    output +=
      (i + 1) +
      "\n";


    output +=
      formatSRTTime(start) +
      " --> " +
      formatSRTTime(end) +
      "\n";


    output +=
      part +
      "\n\n";


    currentTime =
      end;

  }


  return output.trim() + "\n";

}


/* =========================
   SRT TIME
========================= */

function formatSRTTime(
  seconds
){

  if(!Number.isFinite(seconds)){

    seconds = 0;

  }


  const totalMilliseconds =
    Math.max(
      0,
      Math.round(
        seconds * 1000
      )
    );


  const hours =
    Math.floor(
      totalMilliseconds /
      3600000
    );


  const minutes =
    Math.floor(
      (
        totalMilliseconds %
        3600000
      ) /
      60000
    );


  const secs =
    Math.floor(
      (
        totalMilliseconds %
        60000
      ) /
      1000
    );


  const milliseconds =
    totalMilliseconds %
    1000;


  return (

    String(hours)
      .padStart(2,"0")

    + ":" +

    String(minutes)
      .padStart(2,"0")

    + ":" +

    String(secs)
      .padStart(2,"0")

    + "," +

    String(milliseconds)
      .padStart(3,"0")

  );

}


/* =========================
   DOWNLOAD MP3
========================= */

function downloadMP3(){

  if(!audioBlob){

    return;

  }


  const url =
    URL.createObjectURL(
      audioBlob
    );


  const a =
    document.createElement("a");


  a.href = url;

  a.download =
    "myanmar-tts.mp3";


  document
    .body
    .appendChild(a);


  a.click();

  a.remove();


  setTimeout(
    function(){

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );

}


/* =========================
   DOWNLOAD SRT
========================= */

function downloadSRT(){

  if(!srtContent){

    return;

  }


  /*
    UTF-8 BOM ထည့်ထားတာကြောင့်
    Burmese စာကို subtitle software
    တွေမှာ ပိုကောင်းကောင်းဖတ်နိုင်ပါတယ်။
  */

  const blob =
    new Blob(
      [
        "\uFEFF",
        srtContent
      ],
      {
        type:
          "application/x-subrip;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement("a");


  a.href = url;

  a.download =
    "myanmar-tts.srt";


  document
    .body
    .appendChild(a);


  a.click();

  a.remove();


  setTimeout(
    function(){

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );

}

</script>


</body>
</html>
